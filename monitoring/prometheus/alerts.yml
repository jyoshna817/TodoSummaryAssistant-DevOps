groups:
  - name: todo-summary-assistant
    rules:
      - alert: BackendDown
        expr: up{job="todo-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Todo backend is unreachable
          description: Prometheus has failed to scrape the backend for at least 2 minutes.
      - alert: HighHostCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Host CPU usage is high
          description: Average host CPU utilization has exceeded 85% for 10 minutes.
      - alert: HighHostMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Host memory usage is high
          description: Host memory utilization has exceeded 90% for 10 minutes.
