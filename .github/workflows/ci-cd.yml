name: CI and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test backend
        working-directory: Backend/todo-summary-assistant
        run: mvn --batch-mode test

  frontend-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/todo/package-lock.json
      - name: Install dependencies
        working-directory: Frontend/todo
        run: npm ci
      - name: Run frontend tests (non-watch)
        working-directory: Frontend/todo
        run: CI=true npm test -- --watchAll=false --passWithNoTests
      - name: Build frontend
        working-directory: Frontend/todo
        run: npm run build

  publish-images:
    if: github.event_name != 'pull_request'
    needs: [backend-test, frontend-test-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image names
        id: names
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./Backend/todo-summary-assistant
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/todo-summary-assistant-backend:${{ github.sha }}
            ghcr.io/${{ steps.names.outputs.owner }}/todo-summary-assistant-backend:latest
      - uses: docker/build-push-action@v6
        with:
          context: ./Frontend/todo
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/todo-summary-assistant-frontend:${{ github.sha }}
            ghcr.io/${{ steps.names.outputs.owner }}/todo-summary-assistant-frontend:latest

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish-images]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_OWNER,IMAGE_TAG,SPRING_DATASOURCE_URL,SPRING_DATASOURCE_USERNAME,SPRING_DATASOURCE_PASSWORD,COHERE_API_KEY,SLACK_WEBHOOK_URL,GRAFANA_ADMIN_PASSWORD
          script_stop: true
          script: |
            set -eu
            cd /opt/todo-summary-assistant
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            OWNER=$(echo "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')
            cat > .env <<EOF
            BACKEND_IMAGE=ghcr.io/$OWNER/todo-summary-assistant-backend:$IMAGE_TAG
            FRONTEND_IMAGE=ghcr.io/$OWNER/todo-summary-assistant-frontend:$IMAGE_TAG
            SPRING_DATASOURCE_URL=$SPRING_DATASOURCE_URL
            SPRING_DATASOURCE_USERNAME=$SPRING_DATASOURCE_USERNAME
            SPRING_DATASOURCE_PASSWORD=$SPRING_DATASOURCE_PASSWORD
            COHERE_API_KEY=$COHERE_API_KEY
            SLACK_WEBHOOK_URL=$SLACK_WEBHOOK_URL
            CORS_ALLOWED_ORIGINS=http://$(hostname -I | awk '{print $1}')
            GRAFANA_ADMIN_PASSWORD=$GRAFANA_ADMIN_PASSWORD
            EOF
            chmod 600 .env
            docker compose --profile monitoring pull
            docker compose --profile monitoring up -d --remove-orphans
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8081/actuator/health >/dev/null; then exit 0; fi
              sleep 5
            done
            echo 'Health check failed after deployment' >&2
            exit 1
